name: Windows smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build MelloRoos.sln -c Release

      - name: First-run PDF tool setup
        run: dotnet run --project src/MelloRoos.csproj -c Release -- check-deps

      - name: pdftotext smoke (Fillmore CFD 8)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          dotnet run --project src/MelloRoos.csproj -c Release -- text `
            "Reference-Docs/City of Fillmore, CFD 8, RMA.pdf" `
            -o out/fillmore-win.txt
          $len = (Get-Item out/fillmore-win.txt).Length
          Write-Host "Extracted $len chars"
          if ($len -lt 1000) { throw "pdftotext output too short ($len chars)" }

      - name: OCR smoke (scanned PDF, pages 1-2)
        shell: pwsh
        run: |
          $pdf = "Reference-Docs/CFD No. 2000-1, RMA (1).pdf"
          $log = dotnet run --project src/MelloRoos.csproj -c Release -- text $pdf `
            --force-ocr --pages 1-2 -o out/ocr-forced.txt 2>&1 | Out-String
          if ($log -notmatch "Method: ocr-forced") { throw "Expected ocr-forced, got: $log" }
          $forced = (Get-Item out/ocr-forced.txt).Length
          if ($forced -lt 200) { throw "OCR forced output too short ($forced chars)" }
          $log2 = dotnet run --project src/MelloRoos.csproj -c Release -- text $pdf `
            --pages 1-2 -o out/ocr-fallback.txt 2>&1 | Out-String
          if ($log2 -notmatch "Method: ocr-fallback") { throw "Expected ocr-fallback, got: $log2" }
          $fallback = (Get-Item out/ocr-fallback.txt).Length
          if ($fallback -lt 200) { throw "OCR fallback output too short ($fallback chars)" }
          Write-Host "OCR OK: forced=$forced chars, auto-fallback=$fallback chars"

      - name: Escalate sample JSON (no LLM)
        run: dotnet run --project src/MelloRoos.csproj -c Release -- escalate src/rates.json --debt-id 123 --run-date 2026-08-18 -o out/rates-win.sql

      # Uncomment when OPENAI_API_KEY is configured as a repository secret:
      # - name: Full extract smoke
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: dotnet run --project src/MelloRoos.csproj -c Release -- extract "Reference-Docs/City of Fillmore, CFD 8, RMA.pdf" --debt-id 123 --run-date 2026-08-18 --save-json out/extraction-win.json -o out/rates-extract-win.sql
